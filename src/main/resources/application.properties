# env variables
spring.config.import=optional:file:env.properties

# JSON dates
spring.jackson.serialization.write-dates-as-timestamps=false

# JDBC in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# PostgreSQL datasource
spring.sql.init.platform=postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helvar_service_tickets}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# SSL
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=pkcs12
server.ssl.key-store-password=p4ssw0rd
server.ssl.key-password=p4ssw0rd
server.ssl.key-alias=localhost
server.port=8443

# Data alteration
spring.jpa.hibernate.ddl-auto=update

# Database initialization with data.sql after Hibernate creates the schema, only uncomment after wiping the database
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

# ---- Ticket Priority Rules ----
priority.rules.ageHighThresholdMinutes=2880
priority.rules.ageCriticalThresholdMinutes=10080
priority.rules.contractCriticalRemainingMinutes=60
priority.rules.ageContractCriticalThresholdMinutes=1440

# ---- Scheduler Settings ----
priority.rules.enableScheduler=true
priority.rules.schedulerFixedRateSeconds=3600
priority.rules.schedulerBatchSize=200